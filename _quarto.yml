project:
  type: book
  output-dir: _book

book:
  title: "Medizinische Informatik — Prüfungsvorbereitung"
  subtitle: "Fragen und Antworten zur Zusatz-Weiterbildung"
  date: today
  date-format: "DD.MM.YYYY"
  search: true
  reader-mode: true      # Knopf oben: beide Seitenleisten aus-/einblenden
  chapters:
    - index.qmd
    - 01-modul-i-angewandte-informatik.qmd
    - 02-modul-ii-datenschutz-datensicherheit.qmd
    - 03-modul-iii-statistik-epidemiologie-biometrie.qmd
    - 04-modul-iv-medizinische-dokumentation.qmd
    - 05-modul-v-bildverarbeitung-biosignalverarbeitung.qmd
    - 06-modul-vi-entscheidungsunterstuetzung.qmd
    - 07-modul-vii-informations-kommunikationssysteme.qmd
    - 08-modul-viii-management-gesundheits-it.qmd
    - 09-modul-ix-informationsmanagement-klinische-forschung.qmd
    - 10-modul-x-telemedizin-telematik.qmd
  appendices:
    - anhang-abkuerzungen.qmd

lang: de
from: markdown+lists_without_preceding_blankline
filters:
  - merksatz.lua

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: style.css
    grid:
      sidebar-width: 250px   # linke Kapitel-Navigation (Standard: 250px)
      body-width: 1100px     # mittlere Textspalte (Standard: 800px) -> breiter = Tabellen weniger gequetscht
      margin-width: 250px    # rechtes Inhaltsverzeichnis (Standard: 250px)
      gutter-width: 1.5rem   # Abstand zwischen den Spalten
    toc: true
    toc-depth: 3
    toc-expand: 1        # rechts nur Kursbuch-Punkte offen, Unterpunkte klappen beim Scrollen auf
    number-depth: 3
